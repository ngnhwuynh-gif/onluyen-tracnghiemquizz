<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Văn Lang - Đăng nhập</title>
    <!-- Thư viện Google API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            width: 380px;
            text-align: center;
            border: 1px solid #e5e5e5;
            box-sizing: border-box;
        }
        .title {
            color: #d32f2f;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 25px;
        }
        hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 20px 0;
        }
        .desc {
            font-size: 14px;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }
        /* Nút bấm Google tùy chỉnh chuẩn Moodle */
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            background-color: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #3c4043;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .btn-google:hover {
            background-color: #f8f9fa;
        }
        .btn-google img {
            width: 18px;
            height: 18px;
            margin-right: 10px;
        }
        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #d32f2f;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="title">Quiz Văn Lang</div>
        <hr>
        <div class="desc">Đăng nhập bằng tài khoản của bạn trên:</div>
        
        <!-- Nút bấm gọi hàm đăng nhập thủ công qua Token Client -->
        <button class="btn-google" id="loginBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
            Google
        </button>

        <div class="footer">
            Vietnamese (vi) ▾
        </div>
    </div>

    <script>
        let client;

        window.onload = function () {
            // Khởi tạo Token Client của Google
            client = google.accounts.oauth2.initTokenClient({
                client_id: '100491293776-r6tp3vgcrtl93eufhagqdfaie4u21t8b.apps.googleusercontent.com',
                scope: 'https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email',
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        // Lấy thông tin chi tiết người dùng sau khi đăng nhập thành công
                        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                            headers: { 'Authorization': 'Bearer ' + tokenResponse.access_token }
                        })
                        .then(response => response.json())
                        .then(data => {
                            alert("Đăng nhập thành công!\nXin chào: " + data.name + "\nEmail: " + data.email);
                            localStorage.setItem("user_name", data.name);
                            localStorage.setItem("user_email", data.email);
                        });
                    }
                },
            });

            // Gắn sự kiện click cho nút
            document.getElementById('loginBtn').addEventListener('click', () => {
                client.requestAccessToken();
            });
        };
    </script>

</body>
</html>
