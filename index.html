<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Văn Lang - Đăng nhập</title>
    <!-- Thư viện đăng nhập Google chính thức bằng JavaScript -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            width: 380px;
            text-align: center;
            border: 1px solid #e5e5e5;
            box-sizing: border-box;
        }
        .title {
            color: #d32f2f;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 25px;
        }
        hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 20px 0;
        }
        .desc {
            font-size: 14px;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .google-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #d32f2f;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="title">Quiz Văn Lang</div>
        <hr>
        <div class="desc">Đăng nhập bằng tài khoản của bạn trên:</div>
        
        <!-- Khu vực hiển thị nút Google -->
        <div class="google-btn-container">
            <div id="g_id_onload"
                 data-client_id="100491293776-r6tp3vgcrtl93eufhagqdfaie4u21t8b.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-size="large"
                 data-theme="outline"
                 data-text="sign_in_with"
                 data-shape="rectangular"
                 data-logo_alignment="left">
            </div>
        </div>

        <div class="footer">
            Vietnamese (vi) ▾
        </div>
    </div>

    <script>
        function handleCredentialResponse(response) {
            const userData = parseJwt(response.credential);
            alert("Đăng nhập thành công!\nXin chào: " + userData.name + "\nEmail: " + userData.email);
            
            // Lưu thông tin người dùng
            localStorage.setItem("user_name", userData.name);
            localStorage.setItem("user_email", userData.email);
        }

        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }
    </script>

</body>
</html>
